services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civic-postgis
    environment:
      POSTGRES_DB: civic
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
    ports:
      - "5432:5432"
    volumes:
      - civic_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civic_postgres_data:
